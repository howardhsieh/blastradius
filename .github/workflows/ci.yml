name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # blastradius is pure Go. Building with cgo on current macOS runners links
    # test binaries that are missing an LC_UUID load command, which dyld then
    # refuses to run ("signal: abort trap"). Disabling cgo uses the internal
    # linker everywhere and matches the release build (CGO_ENABLED=0).
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # The race detector needs cgo, so it runs on Linux (CGO_ENABLED=1);
      # the other platforms run the full suite with cgo disabled.
      - name: Test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            CGO_ENABLED=1 go test -race ./...
          else
            go test ./...
          fi
      - name: Smoke-test the CLI against an empty home directory
        # The runner's real home is never scanned in CI: the report would list
        # fingerprints of the runner's own credentials in the public log.
        shell: bash
        run: |
          set -euo pipefail
          home=$(mktemp -d)
          go run ./cmd/blastradius scan --home "$home" --no-env -f json | grep -q '"rating": "LOW"'
